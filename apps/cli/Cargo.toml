[package]
name = "valinhall"
version = "0.1.0"
edition = "2021"
description = "AI-Assisted Automated Security Testing Tool"
license = "MIT"
repository = "https://github.com/TheChirag356/valinhall"
keywords = ["security", "testing", "ai", "automation"]

[[bin]]
name = "valinhall"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "cookies"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.8", features = ["parse"] }

# AST / Static Analysis
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
walkdir = "2"
regex = "1"

# Parallelism
rayon = "1"
futures = "0.3"

# HTML report generation
maud = { version = "0.26", features = ["axum"] }
handlebars = "6"

# Web server (embedded, for --serve / live dashboard)
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"

# Error handling & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Terminal UX
indicatif = { version = "0.17", features = ["rayon"] }
colored = "2"
console = "0.15"

# Version / dependency parsing
semver = { version = "1", features = ["serde"] }
cargo_metadata = "0.18"

# ML — Anomaly detection engine
linfa             = "0.7"
linfa-clustering  = "0.7"
ndarray           = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
strsim = "0.11"      # Levenshtein for typosquatting detection
rand = "0.8"
once_cell = "1"
urlencoding = "2"
open = "5.3.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.6"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
